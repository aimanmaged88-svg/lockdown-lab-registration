<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zetland Mosque — Prayer Times</title>
<style>
body{margin:0;background:#0a0a0c;color:#f2f2f2;font:16px/1.5 system-ui,sans-serif;display:flex;justify-content:center}
.wrap{max-width:420px;width:100%;padding:28px 18px}
h1{font-size:26px;margin:0}
.sub{color:#9aa;font-size:13px;margin:4px 0 22px}
.card{background:#141418;border:1px solid #26262c;border-radius:14px;padding:16px 18px;margin-bottom:16px}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #1e1e24}
.row:last-child{border-bottom:0}
.row b{font-weight:600}
.row.next{color:#6fe3a5}
h2{font-size:15px;margin:0 0 8px;color:#bbc}
.ev{padding:8px 0;border-bottom:1px solid #1e1e24}
.ev:last-child{border-bottom:0}
.ev small{color:#9aa;display:block}
.foot{color:#667;font-size:12px;text-align:center;margin-top:18px}
</style></head><body><div class="wrap">
<h1>🕌 Zetland Mosque</h1>
<div class="sub" id="today">Loading…</div>
<div class="card" id="times">Loading prayer times…</div>
<div class="card"><h2>📅 Upcoming events</h2><div id="events"></div></div>
<div class="foot">Times for Zetland, Sydney · aladhan.com</div>
</div>
<script>
// Edit this list to add/change events: [date shown, title, detail]
const EVENTS=[
 ["Every Friday","Jumu'ah prayer","Khutbah before Dhuhr — arrive early"],
];
const E=document.getElementById('events');
E.innerHTML=EVENTS.map(e=>`<div class="ev"><b>${e[1]}</b><small>${e[0]}${e[2]?" · "+e[2]:""}</small></div>`).join('')||'<div class="ev"><small>No events listed yet.</small></div>';

fetch('https://api.aladhan.com/v1/timings?latitude=-33.9064&longitude=151.2080&method=3')
.then(r=>r.json()).then(d=>{
 const t=d.data.timings, date=d.data.date.readable, hij=d.data.date.hijri;
 document.getElementById('today').textContent=date+' · '+hij.day+' '+hij.month.en+' '+hij.year+' AH';
 const order=[['Fajr','Fajr'],['Sunrise','Sunrise'],['Dhuhr','Dhuhr'],['Asr','Asr'],['Maghrib','Maghrib'],['Isha','Isha']];
 const now=new Date(), cur=now.getHours()*60+now.getMinutes();
 let nextIdx=-1;
 order.forEach((o,i)=>{const[m,h]=[+t[o[0]].slice(3,5),+t[o[0]].slice(0,2)];if(nextIdx<0&&o[0]!=='Sunrise'&&h*60+m>cur)nextIdx=i;});
 document.getElementById('times').innerHTML=order.map((o,i)=>
  `<div class="row${i===nextIdx?' next':''}"><b>${o[1]}${i===nextIdx?' · next':''}</b><span>${t[o[0]]}</span></div>`).join('');
}).catch(()=>{document.getElementById('times').textContent='Couldn’t load times — check your connection.'});
</script></body></html>
