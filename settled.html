<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0C10">
<meta name="apple-mobile-web-app-title" content="Settled">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="settled.webmanifest">
<link rel="icon" href="assets/settled-icon-192.png">
<link rel="apple-touch-icon" href="assets/settled-icon-180.png">
<title>Settled</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..900;1,14..32,400..700&display=swap">
<style>
:root{
  --bg:#0B0C10; --bg2:#111319; --card:#15181F; --card2:#1B1F28; --fg:#F4F1EA; --muted:#9A9DA8; --dim:#666A77; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --gold:#E8B04B; --gold2:#F3C86E; --goldsoft:rgba(232,176,75,.14); --ongold:#1A1200;
  --green:#4CC38A; --greensoft:rgba(76,195,138,.14); --red:#F0605A; --redsoft:rgba(240,96,90,.14); --blue:#5EA8FF; --bluesoft:rgba(94,168,255,.14); --purple:#A98BFF; --purplesoft:rgba(169,139,255,.14);
  --nav:rgba(17,19,25,.82); --shadow:0 12px 32px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.4);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5F1E8; --bg2:#EFE9DD; --card:#FFFFFF; --card2:#FAF7F1; --fg:#15130E; --muted:#6B6657; --dim:#9A9484; --line:rgba(21,19,14,.08); --line2:rgba(21,19,14,.14);
  --gold:#B8801C; --gold2:#D39A2E; --goldsoft:rgba(184,128,28,.12); --ongold:#fff;
  --green:#1E9B5E; --greensoft:rgba(30,155,94,.12); --red:#D63F38; --redsoft:rgba(214,63,56,.1); --blue:#2A6FD6; --bluesoft:rgba(42,111,214,.1); --purple:#6E4FD0; --purplesoft:rgba(110,79,208,.1);
  --nav:rgba(255,255,255,.86); --shadow:0 10px 28px rgba(21,19,14,.10),0 1px 2px rgba(21,19,14,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]):not([data-theme="light"]){
  --bg:#F5F1E8; --bg2:#EFE9DD; --card:#FFFFFF; --card2:#FAF7F1; --fg:#15130E; --muted:#6B6657; --dim:#9A9484; --line:rgba(21,19,14,.08); --line2:rgba(21,19,14,.14);
  --gold:#B8801C; --gold2:#D39A2E; --goldsoft:rgba(184,128,28,.12); --ongold:#fff;
  --green:#1E9B5E; --greensoft:rgba(30,155,94,.12); --red:#D63F38; --redsoft:rgba(214,63,56,.1); --blue:#2A6FD6; --bluesoft:rgba(42,111,214,.1); --purple:#6E4FD0; --purplesoft:rgba(110,79,208,.1);
  --nav:rgba(255,255,255,.86); --shadow:0 10px 28px rgba(21,19,14,.10),0 1px 2px rgba(21,19,14,.06);
  color-scheme:light;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body{min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--gold)}
.app{max-width:540px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 0 8px;position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 70%,transparent)}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold2),var(--gold));display:grid;place-items:center;color:var(--ongold);font-weight:900;font-size:17px;letter-spacing:-.02em;box-shadow:0 6px 16px rgba(232,176,75,.25)}
.brand .nm{font-weight:900;letter-spacing:.14em;font-size:13px;text-transform:uppercase}
.brand .sub{font-size:12px;color:var(--muted);margin-top:-2px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:17px}
.view{display:none;animation:rise .28s ease-out}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1.05;margin:10px 0 4px}
h2{font-size:18px;font-weight:800;letter-spacing:-.01em;margin:0}
h3{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 14px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--card2)}
.card.gold{background:linear-gradient(145deg,var(--goldsoft),transparent 60%),var(--card);border-color:rgba(232,176,75,.25)}
.card.green{border-color:rgba(76,195,138,.3)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.chead h2{display:flex;align-items:center;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip b{color:var(--fg)}
.chip.gold{background:var(--goldsoft);color:var(--gold);border-color:transparent}
.chip.green{background:var(--greensoft);color:var(--green);border-color:transparent}
.chip.red{background:var(--redsoft);color:var(--red);border-color:transparent}
.chip.blue{background:var(--bluesoft);color:var(--blue);border-color:transparent}
.chip.sel{background:var(--fg);color:var(--bg);border-color:transparent}
.big{font-size:42px;font-weight:900;letter-spacing:-.04em;line-height:1}
.big small{font-size:16px;font-weight:700;color:var(--muted);letter-spacing:0;margin-left:6px}
.mid{font-size:24px;font-weight:900;letter-spacing:-.03em;line-height:1.05}
.k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat .v{font-size:20px;font-weight:900;letter-spacing:-.02em;margin-top:2px}
.stat .v.sm{font-size:16px}
.bar{height:8px;border-radius:999px;background:var(--line2);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;border-radius:999px;background:var(--gold);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar i.g{background:var(--green)}.bar i.r{background:var(--red)}.bar i.b{background:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;padding:13px 18px;border-radius:14px;background:var(--gold);color:var(--ongold);border:1px solid transparent;transition:transform .12s ease,filter .2s;width:100%}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card2);color:var(--fg);border-color:var(--line2)}
.btn.soft{background:var(--goldsoft);color:var(--gold)}
.btn.green{background:var(--green);color:#04120B}
.btn.red{background:var(--redsoft);color:var(--red)}
.btn.sm{padding:9px 13px;font-size:13.5px;border-radius:11px;width:auto}
.btn.xs{padding:6px 10px;font-size:12.5px;border-radius:9px;width:auto}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .ic{width:38px;height:38px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{display:block;font-size:12.5px;color:var(--muted)}
.row .r{text-align:right;font-weight:800;flex:0 0 auto}
.row .r span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.row.done .t b{text-decoration:line-through;color:var(--muted)}
.tick{width:30px;height:30px;border-radius:10px;border:2px solid var(--line2);display:grid;place-items:center;flex:0 0 auto;font-size:15px;font-weight:900;color:transparent;transition:all .18s}
.tick.on{background:var(--green);border-color:var(--green);color:#04120B}
.del{color:var(--dim);font-size:18px;padding:6px 8px;border-radius:8px}
.del:active{background:var(--redsoft);color:var(--red)}
label.f{display:block;margin:10px 0 0}
label.f span{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.in{width:100%;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:12px 13px;font-size:16px;outline:0;appearance:none;-webkit-appearance:none}
.in:focus{border-color:var(--gold)}
textarea.in{min-height:72px;resize:vertical}
.inrow{display:flex;gap:8px;align-items:center}
.inrow .in{flex:1;min-width:0}
.money{position:relative}
.money .in{padding-left:52px;font-weight:800;font-size:18px}
.money em{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:800;color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--fg);color:var(--bg)}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.hint.warn{color:var(--gold)}
.hint.bad{color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:14px}
.ring{width:84px;height:84px;flex:0 0 auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .bgc{stroke:var(--line2)}
.ring .fgc{stroke:var(--gold);transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:20px;letter-spacing:-.03em}
.ring .lbl small{display:block;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-align:center}
.spark{display:flex;align-items:flex-end;gap:4px;height:64px;margin-top:8px}
.spark i{flex:1;background:var(--gold);border-radius:4px 4px 2px 2px;min-height:3px;opacity:.9;position:relative}
.spark i.lo{background:var(--line2);opacity:1}
.spark i.g{background:var(--green)}.spark i.r{background:var(--red)}
.spark i.tgt::after{content:"";position:absolute;left:0;right:0;top:var(--t);border-top:1px dashed var(--muted)}
.axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:4px;font-weight:600}
.meal{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.meal button{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 8px;font-weight:800;font-size:13px;color:var(--muted)}
.meal button.on{background:var(--greensoft);color:var(--green);border-color:transparent}
.meal button.off{background:var(--redsoft);color:var(--red);border-color:transparent}
.meal button em{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
.cups{display:flex;gap:6px;flex-wrap:wrap}
.cups button{width:34px;height:40px;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-size:16px;opacity:.45}
.cups button.on{opacity:1;background:var(--bluesoft);border-color:transparent}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.catgrid button{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 4px;font-size:11.5px;font-weight:700;color:var(--muted)}
.catgrid button em{display:block;font-style:normal;font-size:20px;margin-bottom:3px}
.catgrid button.on{background:var(--goldsoft);color:var(--gold);border-color:var(--gold)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--nav);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-top:1px solid var(--line)}
nav.tabs .in5{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 4px;border-radius:12px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);transition:all .15s}
nav.tabs button em{font-style:normal;font-size:20px;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
nav.tabs button.on{color:var(--gold)}
nav.tabs button.on em{transform:translateY(-2px) scale(1.08)}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.ovl.on{display:flex;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:540px;max-height:92dvh;overflow:auto;background:var(--bg2);border-radius:24px 24px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .32s cubic-bezier(.2,.8,.2,1);border:1px solid var(--line);border-bottom:0}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 12px}
.sheet h2{font-size:22px;margin-bottom:4px}
.sheet .acts{display:flex;gap:8px;margin-top:16px}
.sheet .acts .btn{flex:1}
.full{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;display:none;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(30px + env(safe-area-inset-bottom,0px))}
.full.on{display:block;animation:fade .25s}
.full .inner{max-width:520px;margin:0 auto}
.steps{display:flex;gap:5px;margin:6px 0 18px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line2)}
.steps i.on{background:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);font-weight:700;font-size:14px;padding:11px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:70;max-width:90vw;text-align:center;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translateX(-50%)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:18px auto 0}
.pinpad button{height:68px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:24px;font-weight:800}
.dots{display:flex;gap:12px;justify-content:center;margin-top:18px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2)}
.dots i.on{background:var(--gold);border-color:var(--gold)}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.tl .m{position:relative;padding:6px 0 14px}
.tl .m::before{content:"";position:absolute;left:-20px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--muted)}
.tl .m.now::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px var(--goldsoft)}
.tl .m.done::before{background:var(--green);border-color:var(--green)}
.tl .m b{display:block;font-weight:800}
.tl .m span{font-size:13px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:12.5px}
.cal .dh{font-size:10px;font-weight:800;color:var(--dim);letter-spacing:.08em;padding:4px 0}
.cal .d{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;position:relative;font-weight:600;color:var(--muted)}
.cal .d.in{color:var(--fg)}
.cal .d.today{background:var(--goldsoft);color:var(--gold);font-weight:900}
.cal .d.sel{outline:2px solid var(--gold)}
.cal .d i{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cal .d i b{width:4px;height:4px;border-radius:2px;background:var(--gold)}
.cal .d i b.b{background:var(--blue)}.cal .d i b.g{background:var(--green)}.cal .d i b.p{background:var(--purple)}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:7px;background:var(--goldsoft);color:var(--gold)}
.pill.g{background:var(--greensoft);color:var(--green)}.pill.b{background:var(--bluesoft);color:var(--blue)}.pill.p{background:var(--purplesoft);color:var(--purple)}.pill.r{background:var(--redsoft);color:var(--red)}
.acc{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.lock-wrap{text-align:center;padding-top:60px}
.q5{display:flex;gap:8px}
.q5 button{flex:1;padding:12px 0;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:20px;opacity:.55}
.q5 button.on{opacity:1;background:var(--goldsoft);border-color:var(--gold)}
.hero-num{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.sub-k{font-size:13px;color:var(--muted);margin-top:6px}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ctxt{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="mark">S</div><div><div class="nm">Settled</div><div class="sub" id="hdrSub">Dubai · built for Aiman</div></div></div>
    <div style="display:flex;gap:8px">
      <button class="iconbtn" id="themeBtn" title="Theme">◐</button>
      <button class="iconbtn" data-go="settings" title="Settings">⚙︎</button>
    </div>
  </header>

  <section class="view" id="v-today"></section>
  <section class="view" id="v-money"></section>
  <section class="view" id="v-place"></section>
  <section class="view" id="v-body"></section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-settings"></section>
</div>

<nav class="tabs"><div class="in5">
  <button data-tab="today" class="on"><em>☀️</em>Today</button>
  <button data-tab="money"><em>💰</em>Money</button>
  <button data-tab="place"><em>🏠</em>Place</button>
  <button data-tab="body"><em>😴</em>Body</button>
  <button data-tab="plan"><em>📅</em>Plan</button>
</div></nav>

<div class="ovl" id="ovl"><div class="sheet" id="sheet"></div></div>
<div class="full" id="setup"><div class="inner" id="setupIn"></div></div>
<div class="full" id="lock"><div class="inner lock-wrap" id="lockIn"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ===================== Settled — core ===================== */
const KEY='settled_v1';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const DAY=86400000;
const pad=n=>String(n).padStart(2,'0');
const iso=d=>{d=d instanceof Date?d:new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const today=()=>iso(new Date());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>iso(new Date(parse(s).getTime()+n*DAY+3600000*6)); // +6h guards DST
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/DAY);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtD=(s,withDow=true)=>{const d=parse(s);return (withDow?DOW[d.getDay()]+' ':'')+d.getDate()+' '+MON[d.getMonth()]};
const fmtDL=s=>{const d=parse(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const hm2min=t=>{const [h,m]=(t||'0:0').split(':').map(Number);return h*60+m};

/* ---- money helpers ---- */
const P=()=>S.profile;
function toAED(amt,cur){amt=+amt||0;if(!cur||cur===P().cur)return amt;return amt*(+P().rate||1)}
function fmt(n,cur,dec=0){n=+n||0;const neg=n<0;n=Math.abs(n);const s=n.toLocaleString('en-AU',{maximumFractionDigits:dec,minimumFractionDigits:dec});return (neg?'−':'')+(cur===undefined?P().cur:cur)+' '+s}
function fmtA(n,dec=0){ // primary currency, with secondary in brackets when enabled
  const a=fmt(n,P().cur,dec);
  if(S.show2&&P().rate>0)return a+' <small>('+fmt(n/P().rate,P().cur2,dec)+')</small>';
  return a;
}
const monthlyIncome=()=>{const i=S.income,a=toAED(i.amt,i.cur);return i.freq==='weekly'?a*52/12:i.freq==='fortnightly'?a*26/12:i.freq==='monthly'?a:a}; // irregular treated as monthly estimate
const fixedMonthly=()=>S.fixed.reduce((t,f)=>t+toAED(f.amt,f.cur),0);
const liquid=()=>S.accounts.reduce((t,a)=>t+toAED(a.bal,a.cur),0);
const debtTotal=()=>S.debts.reduce((t,a)=>t+toAED(a.amt,a.cur),0);
const net=()=>liquid()-debtTotal();
const saved=()=>S.baseline==null?0:net()-S.baseline;
function nextPay(){let n=S.income.next||today();const t=today();let guard=0;
  while(n<t&&guard++<120){n=S.income.freq==='weekly'?addDays(n,7):S.income.freq==='fortnightly'?addDays(n,14):addMonths(n,1)}
  return n}
function addMonths(s,k){const d=parse(s);const day=d.getDate();const x=new Date(d.getFullYear(),d.getMonth()+k,1);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return iso(x)}
function daysToPay(){return Math.max(1,daysBetween(today(),nextPay()))}
function fixedDueBeforePay(){const t=parse(today()).getDate(),np=parse(nextPay()).getDate(),span=daysToPay();
  // fixed costs with a due day falling in (today, nextPay] — approximate by day-of-month
  return S.fixed.reduce((tot,f)=>{const d=+f.day||1;let due=false;for(let i=1;i<=span;i++){const dd=parse(addDays(today(),i)).getDate();if(dd===d){due=true;break}}return tot+(due?toAED(f.amt,f.cur):0)},0)}
function spentOn(d){return S.tx.filter(x=>x.d===d).reduce((t,x)=>t+toAED(x.amt,x.cur),0)}
function spentRange(a,b){return S.tx.filter(x=>x.d>=a&&x.d<=b).reduce((t,x)=>t+toAED(x.amt,x.cur),0)}
function savePerDayNeeded(){const left=Math.max(1,daysBetween(today(),P().settledBy));const need=Math.max(0,(+S.goals.saveDec||0)-saved());return need/left}
function cycleInfo(){const np=nextPay(),f=S.income.freq;const start=f==='weekly'?addDays(np,-7):f==='fortnightly'?addDays(np,-14):addMonths(np,-1);return {np,start,cd:Math.max(1,daysBetween(start,np))}}
function safeToSpend(){ // per day until next pay: what this pay cycle can afford after bills + the savings target
  const {start,cd}=cycleInfo(),d=daysToPay();
  const incPer=toAED(S.income.amt,S.income.cur),fixedPer=fixedMonthly()*cd/30.44,savePer=savePerDayNeeded()*cd;
  const cycleBudget=incPer-fixedPer-savePer,spentCycle=spentRange(start,addDays(today(),-1));
  const cap=(liquid()-fixedDueBeforePay()-(+S.goals.buffer||0))/d; // never more than the cash actually there
  const firstCycle=start<(S.started||today()); // partial first cycle: no phantom rollover from unlogged days
  let perDay=incPer>0?Math.min(firstCycle?cycleBudget/cd:(cycleBudget-spentCycle)/d,cap):cap-savePerDayNeeded();
  return {perDay,days:d,cycleBudget,spentCycle,cap,fixedPer,savePer,incPer,cd}}
function todayBudget(){const s=safeToSpend();return Math.max(0,s.perDay)}
function dayRec(d=today()){if(!S.days[d])S.days[d]={checks:{},meals:{},water:0,train:0,mood:0,note:'',one:'',closed:false};return S.days[d]}
const dayIndex=()=>daysBetween(P().day1,today())+1;

/* ---- sleep helpers ---- */
function sleepHrs(bed,wake){let b=new Date(bed),w=new Date(wake);if(isNaN(b)||isNaN(w))return 0;let h=(w-b)/3600000;if(h<0)h+=24;return Math.round(h*10)/10}
function lastNights(n){const out=[];for(let i=n-1;i>=0;i--){const d=addDays(today(),-i);const r=S.sleep.find(s=>s.date===d);out.push({d,r})}return out}
function sleepAvg(n){const xs=lastNights(n).filter(x=>x.r).map(x=>x.r.hrs);return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:0}
function bedOnTime(r){if(!r||!r.bed)return false;const b=new Date(r.bed);const m=b.getHours()*60+b.getMinutes();let tgt=hm2min(P().bed);const adj=m<300?m+1440:m;const tadj=tgt<300?tgt+1440:tgt;return adj<=tadj+15}

/* ---- checklist ---- */
const CHECKS=()=>[
  ['money','💰','Closed the night — money updated',d=>!!d.closed],
  ['eat','🥗','Ate right — 3 clean meals',d=>['b','l','n'].every(k=>d.meals[k]==='on')],
  ['water','💧','2L+ water (8 cups)',d=>d.water>=8],
  ['move','🏀','Trained / moved 30+ min',d=>d.train>=30],
  ['bed','🛏️','In bed by '+P().bed+' last night',d=>{const r=S.sleep.find(s=>s.date===today());return r?bedOnTime(r):false}],
  ['phone','📵','No phone in bed',null],
  ['plan','🎯','One thing for tomorrow set',d=>!!(d.one&&d.one.trim())],
];
function checkState(d,c){const auto=c[3]?c[3](d):false;return !!(d.checks[c[0]]||auto)}
function score(dkey=today()){const d=dayRec(dkey),cs=CHECKS();return {n:cs.filter(c=>checkState(d,c)).length,t:cs.length}}
function streak(){let n=0;for(let i=1;i<400;i++){const d=addDays(today(),-i);if(d<P().day1)break;const s=score(d);if(s.n>=5)n++;else break}const t=score();return t.n>=5?n+1:n}

/* ---- Google Calendar template link ---- */
function gcal({title,date,time,dur=60,details='',loc=''}){const st=parse(date);if(time){const[h,m]=time.split(':').map(Number);st.setHours(h,m,0,0)}const en=new Date(st.getTime()+(time?dur*60000:DAY));const f=d=>time?d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00':iso(d).replace(/-/g,'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+f(st)+'/'+f(en)+'&details='+encodeURIComponent(details)+'&location='+encodeURIComponent(loc)+'&ctz=Asia/Dubai'}

let TAB='today';
function go(tab){TAB=tab;$$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+tab));$$('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));window.scrollTo({top:0});render()}

  const t=e.target.closest('[data-tab]');if(t){buzz(6);go(t.dataset.tab);return}

});
document.addEventListener('change',e=>{const b=e.target.closest('[data-bind]');if(b)ACT.bind(b.dataset,b)});
document.addEventListener('input',e=>{const b=e.target.closest('[data-live]');if(b)ACT.live(b.dataset,b)});
function openSheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#ovl').classList.add('on');document.body.style.overflow='hidden';const f=$('#sheet [autofocus]');if(f)setTimeout(()=>f.focus(),80)}
function closeSheet(){$('#ovl').classList.remove('on');document.body.style.overflow=''}
function val(id){const el=$('#'+id);if(!el)return'';return el.type==='checkbox'?el.checked:el.value}
function num(id){const v=parseFloat(String(val(id)).replace(/[^0-9.\-]/g,''));return isNaN(v)?0:v}
function render(){({today:renderToday,money:renderMoney,place:renderPlace,body:renderBody,plan:renderPlan,settings:renderSettings}[TAB]||renderToday)();$('#hdrSub').textContent=hdr()}
function hdr(){const di=dayIndex();if(di<1)return 'Dubai · Day 1 is '+fmtD(P().day1);const left=daysBetween(today(),P().settledBy);return 'Day '+di+' · '+(left>=0?left+' days to Settled':'Settled window closed')}
function fieldMoney(id,label,v,cur,ph='0'){return `<label class="f"><span>${label}</span><div class="money"><em>${cur}</em><input class="in" id="${id}" inputmode="decimal" placeholder="${ph}" value="${v||v===0?v:''}"></div></label>`}
function field(id,label,v,type='text',extra=''){return `<label class="f"><span>${label}</span><input class="in" id="${id}" type="${type}" value="${esc(v??'')}" ${extra}></label>`}
function select(id,label,v,opts){return `<label class="f"><span>${label}</span><select class="in" id="${id}">${opts.map(o=>`<option value="${o[0]}" ${String(o[0])===String(v)?'selected':''}>${o[1]}</option>`).join('')}</select></label>`}
function ring(pct,label,sub){const r=36,c=2*Math.PI*r,off=c*(1-Math.min(1,Math.max(0,pct)));return `<div class="ring"><svg width="84" height="84" viewBox="0 0 84 84"><circle class="bgc" cx="42" cy="42" r="${r}"/><circle class="fgc" cx="42" cy="42" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="lbl"><div>${label}<small>${sub}</small></div></div></div>`}
function bar(pct,cls=''){return `<div class="bar"><i class="${cls}" style="width:${Math.min(100,Math.max(0,pct*100)).toFixed(1)}%"></i></div>`}

const ACT={};
ACT.bind=(d,el)=>{ // generic bindings: data-bind="path" e.g. profile.bed
  const path=d.bind.split('.');let o=S;for(let i=0;i<path.length-1;i++)o=o[path[i]];

function accRow(a){return `<div class="row"><input class="in" style="flex:1" value="${esc(a.name)}" data-act-blur placeholder="Account" onchange="ACT.accEdit({id:'${a.id}',k:'name'},this)"><div class="money" style="width:150px"><em>${a.cur}</em><input class="in" inputmode="decimal" value="${a.bal||''}" placeholder="0" onchange="ACT.accEdit({id:'${a.id}',k:'bal'},this)"></div><button class="del" data-act="accDel" data-id="${a.id}">✕</button></div>`}
function debtRow(a){return `<div class="row"><input class="in" style="flex:1" value="${esc(a.name)}" placeholder="Who / what" onchange="ACT.debtEdit({id:'${a.id}',k:'name'},this)"><div class="money" style="width:150px"><em>${a.cur}</em><input class="in" inputmode="decimal" value="${a.amt||''}" placeholder="0" onchange="ACT.debtEdit({id:'${a.id}',k:'amt'},this)"></div><button class="del" data-act="debtDel" data-id="${a.id}">✕</button></div>`}
function fixRow(f){return `<div class="row" style="flex-wrap:wrap"><input class="in" style="flex:1 1 100%" placeholder="What" value="${esc(f.name)}" onchange="ACT.fixEdit({id:'${f.id}',k:'name'},this)"><div class="money" style="flex:1"><em>${f.cur}</em><input class="in" inputmode="decimal" value="${f.amt||''}" placeholder="0" onchange="ACT.fixEdit({id:'${f.id}',k:'amt'},this)"></div><label class="k" style="display:flex;align-items:center;gap:6px">day<input class="in" style="width:60px;text-align:center" inputmode="numeric" title="Day of month" value="${f.day||1}" onchange="ACT.fixEdit({id:'${f.id}',k:'day'},this)"></label><button class="del" data-act="fixDel" data-id="${f.id}">✕</button></div>`}
function captureStep(){const p=P(),g=S.goals;
  if(STEP===0){p.name=val('s_name')||'Aiman';p.arrived=val('s_arrived')||p.arrived;p.day1=val('s_day1')||p.day1;p.settledBy=val('s_settled')||p.settledBy;p.back=val('s_back')||p.back;p.cur=val('s_cur');p.cur2=val('s_cur2');p.rate=num('s_rate')||1;p.bed=val('s_bed')||'23:00';p.wake=val('s_wake')||'06:30';p.closeAt=val('s_close')||'21:30'}
  if(STEP===1){S.income.amt=num('s_inc');S.income.cur=val('s_incur');S.income.freq=val('s_freq');S.income.next=val('s_next')||today()}

function allEvents(){const p=P(),g=S.goals,out=S.events.map(e=>({...e}));
  out.push({id:'m1',title:'Day 1 — the system starts',date:p.day1,kind:'mile'},{id:'m2',title:'Settled — own place, saving, eating right',date:p.settledBy,kind:'mile'},{id:'m3',title:'Move-in target',date:g.movein,kind:'place'},{id:'m4',title:'Back to Sydney',date:p.back,kind:'mile'});
  let np=nextPay();for(let i=0;i<3;i++){out.push({id:'pay'+i,title:'Payday',date:np,kind:'money'});np=S.income.freq==='weekly'?addDays(np,7):S.income.freq==='fortnightly'?addDays(np,14):addMonths(np,1)}
  S.fixed.filter(f=>f.amt>0).forEach(f=>{for(let k=0;k<2;k++){const base=addMonths(today().slice(0,8)+'01',k);const d=parse(base);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();const dd=iso(new Date(d.getFullYear(),d.getMonth(),Math.min(+f.day||1,last)));if(dd>=today())out.push({id:'fx'+f.id+k,title:f.name+' · '+fmt(f.amt,f.cur),date:dd,kind:'money'})}});
  return out.filter(e=>e.date).sort((a,b)=>(a.date+(a.time||''))<(b.date+(b.time||''))?-1:1)}
function renderPlan(){const p=P();if(!CAL_M)CAL_M=today().slice(0,7);const evs=allEvents();const up=evs.filter(e=>e.date>=today()).slice(0,12);
  const m=parse(CAL_M+'-01'),first=m.getDay(),dim=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  const kcls={money:'',place:'b',mile:'p',sleep:'g',other:'g'};
  const dayEv=d=>evs.filter(e=>e.date===d);
  const di=dayIndex(),wk=Math.max(1,Math.ceil(di/7));
  const phases=[['Week 1','Baseline. Log everything, close every night, 3 viewings booked.',1],['Week 2','Trim the leaks. Eating out ≤3×. Shortlist to 3 places.',8],['Week 3','Offer in. Paperwork done. Sleep by '+p.bed+' 5 nights.',15],['Week 4','Sign + deposit. Ejari. Move-in date locked.',22],['Week 5','Move in. DEWA, internet, kitchen stocked.',29],['Week 6','Settled. Review the Sydney fund pace. New normal.',36]];
  let h=`<h1>Plan.</h1><p class="lead">The six weeks, your calendar, and what's coming.</p>
  <div class="card"><div class="chead"><h2>${MON[m.getMonth()]} ${m.getFullYear()}</h2><div style="display:flex;gap:6px"><button class="btn xs ghost" data-act="calPrev">‹</button><button class="btn xs ghost" data-act="calToday">Today</button><button class="btn xs ghost" data-act="calNext">›</button></div></div>
    <div class="cal">${DOW.map(d=>`<div class="dh">${d[0]}</div>`).join('')}${Array.from({length:first},()=>'<div></div>').join('')}${Array.from({length:dim},(_,i)=>{const dd=CAL_M+'-'+pad(i+1);const ev=dayEv(dd);const inWin=dd>=p.day1&&dd<=p.settledBy;return `<div class="d ${inWin?'in':''} ${dd===today()?'today':''} ${dd===CAL_SEL?'sel':''}" data-act="calSel" data-d="${dd}">${i+1}${ev.length?`<i>${ev.slice(0,3).map(e=>`<b class="${kcls[e.kind]||''}"></b>`).join('')}</i>`:''}</div>`}).join('')}</div>
    ${CAL_SEL?`<div style="margin-top:10px"><div class="acc"><b>${fmtDL(CAL_SEL)}</b><button class="btn xs soft" data-act="evAdd" data-d="${CAL_SEL}">＋ Add entry</button></div>${dayEv(CAL_SEL).map(e=>evRow(e)).join('')||'<div class="empty">Nothing on this day.</div>'}</div>`:'<p class="hint">Tap a day to see or add entries. Dots: gold money · blue place · purple milestone.</p>'}
  </div>
  <div class="card"><div class="chead"><h2>Coming up</h2><button class="btn xs soft" data-act="evAdd" data-d="${today()}">＋ Add entry</button></div>${up.map(e=>evRow(e)).join('')||'<div class="empty">Clear runway.</div>'}
    <p class="hint">Nightly close + lights-out reminders live in your Google Calendar (daily). Entries here can be sent there with one tap.</p></div>
  <div class="card"><div class="chead"><h2>The six weeks</h2><span class="chip gold">week ${Math.min(6,wk)} of 6</span></div><div class="tl">${phases.map((ph,i)=>`<div class="m ${di>=ph[2]&&di<ph[2]+7?'now':di>=ph[2]+7?'done':''}"><b>${ph[0]} · ${fmtD(addDays(p.day1,ph[2]-1),false)}</b><span>${ph[1]}</span></div>`).join('')}</div></div>
  <div class="card flat"><div class="chead"><h2>Weekly review</h2><button class="btn xs soft" data-act="reviewNew">Write this week's</button></div>
    ${S.reviews.length?S.reviews.slice().reverse().slice(0,6).map(r=>`<div class="row"><div class="ic">📝</div><div class="t"><b>${fmtD(r.d)} · net ${fmt(r.net)} · ${r.spend?fmt(r.spend)+' spent':''}</b><span style="white-space:normal">${esc(r.win)}${r.focus?' → '+esc(r.focus):''}</span></div></div>`).join(''):'<div class="empty">Sundays. Five minutes. Keeps the week honest.</div>'}
  </div>`;
  $('#v-plan').innerHTML=h;
}
function evRow(e){const kc={money:'',place:'b',mile:'p',sleep:'g',other:'g'}[e.kind]||'g';const custom=S.events.some(x=>x.id===e.id);return `<div class="row"><div class="ic">${{money:'💰',place:'🏠',mile:'🏁',sleep:'😴',other:'📌'}[e.kind]||'📌'}</div><div class="t"><b>${esc(e.title)}</b><span>${fmtDL(e.date)}${e.time?' · '+e.time:''}${e.note?' · '+esc(e.note):''}</span></div><div style="display:flex;gap:4px"><a class="btn xs ghost" target="_blank" rel="noopener" title="Add to Google Calendar" href="${gcal({title:e.title,date:e.date,time:e.time,details:e.note||'From Settled'})}">📅</a>${custom?`<button class="btn xs ghost" data-act="evEdit" data-id="${e.id}">Edit</button>`:''}</div></div>`}
ACT.calPrev=()=>{CAL_M=addMonths(CAL_M+'-01',-1).slice(0,7);render()};ACT.calNext=()=>{CAL_M=addMonths(CAL_M+'-01',1).slice(0,7);render()};ACT.calToday=()=>{CAL_M=today().slice(0,7);CAL_SEL=today();render()};
ACT.calSel=d=>{CAL_SEL=CAL_SEL===d.d?null:d.d;render()};
ACT.evAdd=d=>evSheet({id:'',title:'',date:d.d||today(),time:'',kind:'other',note:''});
ACT.evEdit=d=>{const e=S.events.find(x=>x.id===d.id);if(e)evSheet(e)};
function evSheet(e){openSheet(`<h2>${e.id?'Edit entry':'New entry'}</h2>${field('ev_t','What',e.title,'text','autofocus placeholder="e.g. Pay DEWA, Viewing, Leg day"')}<div class="grid2">${field('ev_d','Date',e.date,'date')}${field('ev_tm','Time (optional)',e.time,'time')}</div>${select('ev_k','Type',e.kind,[['other','General'],['money','Money'],['place','Place'],['sleep','Body'],['mile','Milestone']])}${field('ev_n','Note',e.note)}
  <div class="acts">${e.id?`<button class="btn red" data-act="evDel" data-id="${e.id}">Delete</button>`:'<button class="btn ghost" data-act="close">Cancel</button>'}<button class="btn" data-act="evSave" data-id="${e.id}">Save</button></div>`)}
ACT.evSave=d=>{const o={id:d.id||uid(),title:val('ev_t').trim()||'Entry',date:val('ev_d')||today(),time:val('ev_tm'),kind:val('ev_k'),note:val('ev_n')};const i=S.events.findIndex(x=>x.id===o.id);if(i>=0)S.events[i]={...S.events[i],...o};else S.events.push(o);save();closeSheet();render();toast('Added. Tap 📅 to put it in Google Calendar.')};
ACT.evDel=d=>{S.events=S.events.filter(x=>x.id!==d.id);save();closeSheet();render()};
ACT.reviewNew=()=>{const a=addDays(today(),-6);openSheet(`<h2>Weekly review</h2><p class="lead">${fmtD(a)} → ${fmtD(today())}</p>
  <div class="grid3"><div class="stat"><div class="k">Spent</div><div class="v sm">${fmt(spentRange(a,today()))}</div></div><div class="stat"><div class="k">Sleep avg</div><div class="v sm">${sleepAvg(7)?sleepAvg(7).toFixed(1)+'h':'—'}</div></div><div class="stat"><div class="k">Clean</div><div class="v sm">${cleanPct(7)}%</div></div></div>
  ${field('rv_win','Biggest win','','text','autofocus')}${field('rv_leak','Biggest leak','')}${field('rv_focus','Next week\'s one focus','')}
  <div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="reviewSave">Save</button></div>`)};
ACT.reviewSave=()=>{S.reviews.push({d:today(),net:net(),spend:spentRange(addDays(today(),-6),today()),sleep:sleepAvg(7),clean:cleanPct(7),win:val('rv_win'),leak:val('rv_leak'),focus:val('rv_focus')});save();closeSheet();render();toast('Week closed. 📝')};

/* ===================== SETTINGS ===================== */
function renderSettings(){const p=P();
  let h=`<h1>Settings.</h1><p class="lead">Everything lives on this phone. Back it up weekly.</p>
  <div class="card"><h3>You & dates</h3>
    ${field('st_name','Name',p.name)}
    <div class="grid2">${field('st_arrived','Landed in Dubai',p.arrived,'date')}${field('st_day1','Day 1',p.day1,'date')}</div>
    <div class="grid2">${field('st_settled','Settled by',p.settledBy,'date')}${field('st_back','Back to Sydney',p.back,'date')}</div>
    <div class="grid2">${field('st_bed','Lights out',p.bed,'time')}${field('st_wake','Wake',p.wake,'time')}</div>
    ${field('st_close','Nightly close at',p.closeAt,'time')}
    <div class="grid3">${select('st_cur','Main',p.cur,[['AED','AED'],['AUD','AUD'],['USD','USD']])}${select('st_cur2','Second',p.cur2,[['AUD','AUD'],['AED','AED'],['USD','USD'],['EGP','EGP']])}${field('st_rate','Rate',p.rate,'number','step="0.01" inputmode="decimal"')}</div>
    <p class="hint">Rate = how many ${p.cur} one ${p.cur2} buys. Check it when you transfer; it drifts.</p>
    <button class="btn sm" style="margin-top:10px" data-act="saveProfile">Save</button></div>
  <div class="card"><h3>Look</h3><div class="seg">${[['auto','Auto'],['dark','Dark'],['light','Light']].map(t=>`<button class="${(p.theme||'auto')===t[0]?'on':''}" data-act="theme" data-t="${t[0]}">${t[1]}</button>`).join('')}</div></div>
  <div class="card"><h3>Lock</h3><p class="ctxt" style="margin:0 0 10px">${p.pin?'PIN is on. Asked every time the app opens.':'Add a 4-digit PIN so a borrowed phone doesn\'t show your money.'}</p><div class="grid2"><button class="btn ghost sm" style="width:100%" data-act="pinSet">${p.pin?'Change PIN':'Set a PIN'}</button>${p.pin?'<button class="btn red sm" style="width:100%" data-act="pinOff">Turn off</button>':''}</div></div>
  <div class="card"><h3>Reminders</h3><p class="ctxt" style="margin:0 0 10px">Daily reminders run from Google Calendar (money close ${p.closeAt}, lights out ${p.bed}, Sunday review). This page can't buzz you when it's closed — the calendar can.</p>
    <a class="btn ghost sm" target="_blank" rel="noopener" href="${gcal({title:'💰 Money close — Settled',date:today(),time:p.closeAt,dur:10,details:'Open Settled → Close the night. 3 minutes: balances, rate the day, one thing tomorrow.'})}">📅 Re-add nightly close reminder</a>
    <a class="btn ghost sm" style="margin-top:6px" target="_blank" rel="noopener" href="${gcal({title:'🌙 Lights out — Settled',date:today(),time:p.bed,dur:15,details:'Phone down. Tap Lights out now in Settled.'})}">📅 Re-add lights-out reminder</a>
    <p class="hint">After opening, set it to repeat daily inside Google Calendar.</p></div>
  <div class="card"><h3>Backup</h3><div class="grid2"><button class="btn ghost sm" style="width:100%" data-act="backup">⬇️ Export JSON</button><label class="btn ghost sm" style="width:100%">⬆️ Restore<input type="file" accept="application/json,.json" style="display:none" onchange="ACT.restore({},this)"></label></div>
    <p class="hint">${S.snaps.length} nightly snapshots · ${S.tx.length} spends · ${S.sleep.length} nights · ${Object.keys(S.days).length} days logged.</p></div>
  <div class="card flat"><h3>Danger</h3><div class="grid2"><button class="btn ghost sm" style="width:100%" data-act="rebase">Re-stamp Day-0 baseline</button><button class="btn red sm" style="width:100%" data-act="wipe">Wipe everything</button></div><p class="hint">Baseline = the net worth your savings progress counts from (now ${fmt(S.baseline||0)}).</p></div>
  <p class="hint" style="text-align:center;margin:20px 0">Settled · built for ${esc(p.name)} · nothing leaves this phone</p>`;
  $('#v-settings').innerHTML=h;
}
ACT.saveProfile=()=>{const p=P();p.name=val('st_name')||p.name;p.arrived=val('st_arrived')||p.arrived;p.day1=val('st_day1')||p.day1;p.settledBy=val('st_settled')||p.settledBy;p.back=val('st_back')||p.back;p.bed=val('st_bed')||p.bed;p.wake=val('st_wake')||p.wake;p.closeAt=val('st_close')||p.closeAt;p.cur=val('st_cur');p.cur2=val('st_cur2');p.rate=num('st_rate')||p.rate;save();render();toast('Saved')};
ACT.theme=d=>{P().theme=d.t;save();applyTheme();render()};
function applyTheme(){const t=P().theme||'auto';if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);$('meta[name=theme-color]').setAttribute('content',dark?'#0B0C10':'#F5F1E8')}
$('#themeBtn').addEventListener('click',()=>{const t=P().theme||'auto';const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);P().theme=dark?'light':'dark';save();applyTheme();buzz(6)});
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('settled:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let PIN_BUF='',PIN_MODE='unlock',PIN_FIRST='';
function renderLock(title,sub){$('#lockIn').innerHTML=`<div class="brand" style="justify-content:center"><div class="mark">S</div></div><h1 style="margin-top:18px">${title}</h1><p class="lead">${sub}</p><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<PIN_BUF.length?'on':''}"></i>`).join('')}</div><div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="pinKey" data-n="${n}">${n}</button>`).join('')}<button data-act="pinCancel" style="font-size:14px">${PIN_MODE==='unlock'?'':'Cancel'}</button><button data-act="pinKey" data-n="0">0</button><button data-act="pinBack">⌫</button></div>`}
ACT.pinKey=async d=>{if(PIN_BUF.length>=4)return;PIN_BUF+=d.n;buzz(6);
  if(PIN_BUF.length===4){const h=await sha(PIN_BUF);
    if(PIN_MODE==='unlock'){if(h===P().pin){$('#lock').classList.remove('on');PIN_BUF=''}else{PIN_BUF='';buzz([40,40,40]);renderLock('Wrong PIN','Try again.');return}}
    else if(PIN_MODE==='set1'){PIN_FIRST=h;PIN_BUF='';PIN_MODE='set2';renderLock('Once more','Confirm the PIN.');return}
    else if(PIN_MODE==='set2'){if(h===PIN_FIRST){P().pin=h;save();$('#lock').classList.remove('on');PIN_BUF='';toast('PIN set');render()}else{PIN_BUF='';PIN_MODE='set1';renderLock('Didn\'t match','Start again.');return}}
  }
  renderLock(PIN_MODE==='unlock'?'Enter PIN':'Set a PIN',PIN_MODE==='unlock'?'Your money is behind this.':'Four digits.')};
ACT.pinBack=()=>{PIN_BUF=PIN_BUF.slice(0,-1);renderLock(PIN_MODE==='unlock'?'Enter PIN':'Set a PIN','')};
ACT.pinCancel=()=>{if(PIN_MODE!=='unlock'){$('#lock').classList.remove('on');PIN_BUF=''}};
ACT.pinSet=()=>{PIN_MODE='set1';PIN_BUF='';$('#lock').classList.add('on');renderLock('Set a PIN','Four digits.')};
ACT.pinOff=()=>{P().pin=null;save();render();toast('PIN off')};
ACT.backup=()=>{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const name='settled-backup-'+today()+'.json';const f=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Settled backup'}).catch(()=>{})}else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}};
ACT.restore=(d,el)=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.v!==1||!j.profile)throw 0;if(!confirm('Replace everything on this phone with the backup?'))return;localStorage.setItem(KEY,JSON.stringify(j));S=load();applyTheme();render();toast('Restored')}catch(e){toast('That file isn\'t a Settled backup')}};r.readAsText(f)};
ACT.rebase=()=>{if(confirm('Re-stamp today\'s net worth as Day 0? Savings progress restarts from here.')){S.baseline=net();snap();save();render();toast('Baseline re-stamped')}};
ACT.wipe=()=>{if(confirm('Wipe EVERYTHING on this phone? Export a backup first.')&&confirm('Last chance — this cannot be undone.')){localStorage.removeItem(KEY);location.reload()}};

/* ===================== BOOT ===================== */
applyTheme();
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);
if(!S.setup){openSetup()}else if(P().pin){PIN_MODE='unlock';$('#lock').classList.add('on');renderLock('Enter PIN','Your money is behind this.')}
go('today');
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
setInterval(()=>{if(!document.hidden)render()},60000);
</script>
</body>
