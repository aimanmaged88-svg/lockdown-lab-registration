<!doctype html>
<html lang="en-AU">
<head><meta charset="utf-8"><title>Form definitions</title><meta name="robots" content="noindex"></head>
<body>
<!-- Netlify finds forms by scanning deployed HTML at build time. The React form
     on /coaching posts here; this file exists only so the form is registered.
     Field names must match exactly what the form sends. -->
<form name="coaching-eoi" data-netlify="true" netlify-honeypot="website" hidden>
  <input type="text" name="fullName">
  <input type="text" name="age">
  <input type="text" name="guardianName">
  <input type="text" name="guardianPhone">
  <input type="text" name="mobile">
  <input type="text" name="email">
  <input type="text" name="instagram">
  <input type="text" name="suburb">
  <input type="text" name="level">
  <input type="text" name="position">
  <input type="text" name="interest">
  <input type="text" name="focus">
  <input type="text" name="focusOther">
  <input type="text" name="bestTime">
  <textarea name="notes"></textarea>
  <input type="text" name="website">
</form>
</body>
</html>
