<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Love of the Game — Editor</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#09090B;--court:#121215;--court2:#17171B;--chalk:#F2EFE6;--chalk2:#D9D4C7;--ash:#9A958A;--dim:#66635C;--gold:#E2B44E;--gold2:#F0CF83;
    --line:rgba(242,239,230,.12);--line2:rgba(242,239,230,.06);--ok:#8FE3B0;--bad:#E9A6A6;--disp:'Archivo',sans-serif;--body:'Hanken Grotesk',system-ui,sans-serif}
  *{box-sizing:border-box}html,body{margin:0}body{background:var(--ink);color:var(--chalk);font-family:var(--body);-webkit-font-smoothing:antialiased;padding-bottom:100px}
  a{color:var(--gold);text-decoration:none}
  .bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(14px,4vw,26px);
    background:rgba(9,9,11,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line2)}
  .bar b{font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
  .bar b span{color:var(--gold)}
  .bar .r{display:flex;gap:8px;align-items:center}
  .ib{background:rgba(242,239,230,.04);border:1px solid var(--line);color:var(--chalk2);border-radius:6px;font-family:var(--disp);font-weight:700;font-size:11px;
    letter-spacing:.08em;text-transform:uppercase;padding:10px 13px;cursor:pointer;min-height:42px}
  .ib:hover{border-color:var(--gold);color:var(--chalk)}
  .wrap{max-width:760px;margin:0 auto;padding:clamp(16px,4vw,30px) clamp(14px,4vw,26px)}
  /* auth */
  .auth{max-width:400px;margin:8vh auto 0;padding:0 20px;text-align:center}
  .auth .mark{font-family:var(--disp);font-weight:900;font-size:26px;letter-spacing:-.02em;line-height:1}
  .auth .mark span{color:var(--gold)}
  .auth .sub{color:var(--ash);font-size:14px;margin:8px 0 26px;line-height:1.5}
  .card{background:linear-gradient(180deg,var(--court2),var(--court));border:1px solid var(--line);border-radius:10px;padding:24px 20px;text-align:left;
    box-shadow:0 40px 90px -50px rgba(0,0,0,.9)}
  .card h2{font-family:var(--disp);font-weight:900;font-size:20px;margin:0 0 4px}
  .card .tip{color:var(--ash);font-size:13px;margin:0 0 18px;line-height:1.5}
  label.fl{display:block;font-family:var(--disp);font-weight:700;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash);margin:0 0 6px}
  input,textarea{width:100%;background:rgba(242,239,230,.04);border:1px solid var(--line);border-radius:7px;color:var(--chalk);font-family:var(--body);
    font-size:16px;padding:13px 14px;outline:none;transition:border-color .15s}
  input:focus,textarea:focus{border-color:var(--gold);background:rgba(242,239,230,.06)}
  textarea{min-height:92px;resize:vertical;line-height:1.5}
  .f{margin-bottom:14px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:.06em;
    text-transform:uppercase;background:var(--gold);color:#17130A;border:0;border-radius:7px;padding:15px;cursor:pointer;min-height:50px;box-shadow:0 14px 30px -14px rgba(226,180,78,.5)}
  .btn:hover{background:var(--gold2)}.btn[disabled]{opacity:.6;cursor:default;box-shadow:none}
  .btn.ghost{background:rgba(242,239,230,.03);color:var(--chalk);border:1px solid var(--line);box-shadow:none}
  .err{color:var(--bad);font-size:13px;min-height:18px;margin:10px 0 0;line-height:1.4}
  .swap{margin:16px 0 0;text-align:center;color:var(--ash);font-size:13px}.swap a{cursor:pointer}
  /* dashboard */
  .lead{color:var(--ash);font-size:14.5px;line-height:1.55;margin:0 0 6px}
  .sec{border-top:1px solid var(--line2);padding:22px 0 6px}
  .sec:first-of-type{border-top:0}
  .sec h3{font-family:var(--disp);font-weight:900;font-size:clamp(17px,2.4vw,20px);letter-spacing:-.01em;margin:0 0 2px}
  .sec .sc{font-family:var(--disp);font-weight:700;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:0 0 16px}
  .row{margin-bottom:16px}
  .row .lbl{font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 6px}
  .row.img{display:flex;gap:12px;align-items:center}
  .row.img .th{width:74px;height:74px;flex:0 0 auto;border-radius:8px;overflow:hidden;background:var(--court);border:1px solid var(--line)}
  .row.img .th img{width:100%;height:100%;object-fit:cover;display:block}
  .row.img .ic{flex:1 1 auto;min-width:0}
  .up{display:inline-flex;align-items:center;gap:8px;background:rgba(242,239,230,.04);border:1px solid var(--line);color:var(--chalk);border-radius:7px;
    font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:11px 14px;cursor:pointer;min-height:44px}
  .up:hover{border-color:var(--gold)}
  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px clamp(14px,4vw,26px) calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,var(--ink) 60%,transparent);display:flex;gap:10px;max-width:760px;margin:0 auto;transform:translateY(140%);transition:transform .3s cubic-bezier(.16,1,.3,1)}
  .savebar.on{transform:none}
  .savebar .btn{flex:1}
  .toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);opacity:0;z-index:40;background:var(--court2);border:1px solid var(--line);
    color:var(--chalk);font-size:13.5px;padding:12px 18px;border-radius:8px;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 20px 50px -20px rgba(0,0,0,.9);max-width:88vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.bad{border-color:rgba(233,166,166,.5);color:var(--bad)}
  .hint{color:var(--dim);font-size:12px;margin-top:4px}
  /* editors panel */
  .ednote{font-size:12.5px;color:var(--ash);line-height:1.5;margin:-2px 0 12px}
  .edlist{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .edrow{display:flex;align-items:center;gap:10px;background:rgba(242,239,230,.03);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .edrow .em{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
  .edrow .mechip{font-size:11px;color:var(--dim)}
  .edrow .st{font-family:var(--disp);font-weight:700;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
  .edrow .st.a{color:var(--ok);border-color:rgba(143,227,176,.4)}
  .edrow .st.i{color:var(--gold);border-color:rgba(226,180,78,.4)}
  .edrow .rm{background:none;border:0;color:var(--dim);cursor:pointer;font-size:17px;line-height:1;padding:4px 6px;min-height:34px}
  .edrow .rm:hover{color:var(--bad)}
  .edadd{display:flex;gap:8px}.edadd input{flex:1 1 auto}
  .edadd .up{white-space:nowrap}
  /* dashboard shell + inbox */
  .hd{position:sticky;top:0;z-index:20;background:var(--ink)}
  .hd .bar{position:static}
  .tabnav{display:flex;background:rgba(9,9,11,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line2)}
  .tabnav button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--ash);font-family:var(--disp);font-weight:800;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;padding:13px 6px;cursor:pointer;min-height:46px}
  .tabnav button.on{color:var(--chalk);border-bottom-color:var(--gold)}
  .tabnav .badge{display:inline-block;min-width:17px;padding:1px 5px;margin-left:5px;border-radius:99px;background:var(--gold);color:#17130A;font-size:10px;font-weight:800;font-family:var(--disp)}
  .ibhead{margin:0 0 14px}
  .ibhead h2{font-family:var(--disp);font-weight:900;font-size:22px;margin:0 0 4px}
  .stseg{display:flex;gap:6px;margin:0 0 12px}
  .stseg button{flex:1;background:rgba(242,239,230,.03);border:1px solid var(--line);color:var(--ash);border-radius:8px;font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:10px 6px;cursor:pointer;min-height:42px}
  .stseg button.on{color:var(--chalk);border-color:var(--gold);background:rgba(226,180,78,.08)}
  .stseg button i{font-style:normal;opacity:.7;margin-left:3px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:0 0 4px;margin:0 0 14px;-webkit-overflow-scrolling:touch}
  .chips button{flex:0 0 auto;background:rgba(242,239,230,.03);border:1px solid var(--line);color:var(--chalk2);border-radius:99px;font-size:12.5px;padding:7px 12px;cursor:pointer;white-space:nowrap;min-height:34px}
  .chips button.on{background:var(--chalk);color:var(--ink);border-color:var(--chalk);font-weight:600}
  .chips button i{font-style:normal;opacity:.55;margin-left:4px}
  .msgs{display:flex;flex-direction:column;gap:10px}
  .msg{background:linear-gradient(180deg,var(--court2),var(--court));border:1px solid var(--line);border-radius:10px;padding:14px 15px}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
  .cat{font-family:var(--disp);font-weight:800;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(226,180,78,.35);border-radius:99px;padding:3px 9px}
  .ago{font-size:11.5px;color:var(--dim);white-space:nowrap}
  .who{font-size:14px;color:var(--chalk);margin-bottom:6px;word-break:break-word}
  .who a{color:var(--gold)}
  .mbody{font-size:13.5px;line-height:1.5;color:var(--chalk2);white-space:pre-wrap;word-break:break-word}
  .mact{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
  .mact button{background:rgba(242,239,230,.04);border:1px solid var(--line);color:var(--chalk2);border-radius:7px;font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.04em;padding:9px 12px;cursor:pointer;min-height:38px}
  .mact button:hover{border-color:var(--gold);color:var(--chalk)}
  .mact button.ap{background:rgba(143,227,176,.1);border-color:rgba(143,227,176,.4);color:var(--ok)}
  .mact button.del{margin-left:auto;color:var(--dim)}
  .mact button.del:hover{color:var(--bad);border-color:rgba(233,166,166,.5)}
  .ibempty{text-align:center;color:var(--dim);font-size:14px;padding:40px 10px;border:1px dashed var(--line);border-radius:10px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"><div class="wrap" style="text-align:center;color:var(--ash);padding-top:16vh">Loading…</div></div>
<div class="toast" id="toast"></div>
<script>
window.EDIT_EDGE = "__EDGE__";
window.EDIT_ANON = "__ANON__";
window.EDIT_MANIFEST = __MANIFEST__;
(function(){
  var EDGE=window.EDIT_EDGE, ANON=window.EDIT_ANON, MAN=window.EDIT_MANIFEST||[];
  var app=document.getElementById('app'), toastEl=document.getElementById('toast'), tt=null;
  var token=null, overrides={}, dirty={}, defaults={};
  MAN.forEach(function(m){ defaults[m.key]=m.default||''; });
  function api(p){ return fetch(EDGE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+ANON,'apikey':ANON},body:JSON.stringify(p)})
    .then(function(r){ return r.json().catch(function(){return{};}).then(function(j){ return {ok:r.ok,status:r.status,j:j}; }); }); }
  function getTok(){ try{return localStorage.getItem('lotg_edit_tok')||'';}catch(e){return'';} }
  function setTok(t){ try{ if(t)localStorage.setItem('lotg_edit_tok',t); else localStorage.removeItem('lotg_edit_tok'); }catch(e){} token=t||null; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function toast(msg,bad){ toastEl.textContent=msg; toastEl.className='toast on'+(bad?' bad':''); clearTimeout(tt); tt=setTimeout(function(){toastEl.className='toast';},2600); }
  function cur(k){ return (k in overrides)?overrides[k]:(defaults[k]||''); }
  var INBOX="https://ymuwuhvqqftgpxwhzoub.supabase.co/functions/v1/lotg-inbox";
  function ibapi(p){ return fetch(INBOX,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+ANON,"apikey":ANON},body:JSON.stringify(p)})
    .then(function(r){ return r.json().catch(function(){return{};}).then(function(j){ return {ok:r.ok,status:r.status,j:j}; }); }); }

  // ---------- auth ----------
  function fail(){ app.innerHTML='<div class="wrap" style="text-align:center;color:var(--bad);padding-top:14vh">Could not reach the editor. Check your connection and reload.</div>'; }
  function boot(){
    token=getTok();
    api({action:'content'}).then(function(r){
      overrides=(r.j&&r.j.items)||{};
      if(token){ return api({action:'me',token:token}).then(function(m){ if(m.ok&&m.j&&m.j.ok) dash(m.j.email); else { setTok(''); authScreen('login'); } }); }
      authScreen('login');
    }).catch(function(){ fail(); });
  }
  // mode: 'login' (email + password) or 'claim' (first-time set password for an invited email)
  function authScreen(mode){
    var claim = (mode==='claim');
    app.innerHTML =
      '<div class="auth"><div class="mark">LOVE OF THE <span>GAME</span></div><div class="sub">Site editor</div>'
      + '<div class="card">'
      + '<h2 id="atitle">'+(claim?'Set your password':'Sign in')+'</h2>'
      + '<p class="tip" id="atip">'+(claim?'First time? Set the password you’ll use from now on — use the email you were added with.':'Enter your email and password to edit the site.')+'</p>'
      + '<div class="f"><label class="fl" for="em">Email</label><input id="em" type="email" autocomplete="username" placeholder="you@email.com"></div>'
      + '<div class="f"><label class="fl" for="pw">Password</label><input id="pw" type="password" autocomplete="'+(claim?'new-password':'current-password')+'" placeholder="'+(claim?'At least 8 characters':'Your password')+'"></div>'
      + (claim?'<div class="f"><label class="fl" for="pw2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password" placeholder="Type it again"></div>':'')
      + '<button class="btn" id="ago">'+(claim?'Set password &amp; sign in':'Sign in')+'</button>'
      + '<p class="err" id="aerr"></p>'
      + '<p class="swap">'+(claim?'Already set up? <a id="aswap">Sign in</a>':'First time here? <a id="aswap">Set your password</a>')+'</p>'
      + '</div></div>';
    var em=document.getElementById('em'), pw=document.getElementById('pw'), pw2=document.getElementById('pw2'), err=document.getElementById('aerr'), go=document.getElementById('ago');
    document.getElementById('aswap').onclick=function(){ authScreen(claim?'login':'claim'); };
    function submit(){
      var e=(em.value||'').trim().toLowerCase(), p=pw.value||'';
      if(!e||!p){ err.textContent='Enter your email and password.'; return; }
      if(claim){ if(p.length<8){ err.textContent='Password needs at least 8 characters.'; return; } if(pw2 && pw2.value!==p){ err.textContent='Those passwords don’t match.'; return; } }
      var lbl=go.textContent; go.disabled=true; go.textContent='…'; err.textContent='';
      api({action:(claim?'claim':'login'), email:e, password:p}).then(function(r){
        go.disabled=false; go.textContent=lbl;
        if(r.ok&&r.j&&r.j.ok&&r.j.token){ setTok(r.j.token); dash(r.j.email); return; }
        var code=r.j&&r.j.code;
        if(code==='setpw'){ authScreen('claim'); setTimeout(function(){ var x=document.getElementById('em'); if(x)x.value=e; var er=document.getElementById('aerr'); if(er)er.textContent='Looks like your first time — set a password below.'; var pf=document.getElementById('pw'); if(pf)pf.focus(); },0); return; }
        if(code==='exists'){ authScreen('login'); setTimeout(function(){ var x=document.getElementById('em'); if(x)x.value=e; var pf=document.getElementById('pw'); if(pf)pf.focus(); },0); return; }
        err.textContent=(r.j&&r.j.error)||'That didn’t work.';
      }).catch(function(){ go.disabled=false; go.textContent=lbl; err.textContent='Could not reach the editor.'; });
    }
    go.onclick=submit;
    [em,pw,pw2].forEach(function(el){ if(el) el.addEventListener('keydown',function(ev){ if(ev.key==='Enter') submit(); }); });
    em.focus();
  }

  // ---------- dashboard shell ----------
  var ME='', VIEW='inbox';
  function dash(email){
    ME=email; dirty={};
    app.innerHTML =
      '<header class="hd"><div class="bar"><b>Love of the <span>Game</span> · Desk</b>'
        +'<div class="r"><a class="ib" href="/" target="_blank" rel="noopener">View site</a><button class="ib" id="logout">Log out</button></div></div>'
        +'<div class="tabnav">'
          +'<button data-v="inbox" class="on">Inbox <span class="badge" id="ibBadge" hidden>0</span></button>'
          +'<button data-v="edit">Edit site</button>'
          +'<button data-v="team">Team</button>'
        +'</div></header>'
      +'<div class="wrap" id="view"></div>'
      +'<div class="savebar" id="savebar" style="display:none"><button class="btn ghost" id="discard" style="flex:.5">Discard</button><button class="btn" id="saveall">Save changes</button></div>';
    document.getElementById('logout').onclick=function(){ api({action:'logout',token:token}); setTok(''); boot(); };
    document.querySelector('.tabnav').addEventListener('click',function(e){ var b=e.target.closest('button[data-v]'); if(b) show(b.getAttribute('data-v')); });
    document.getElementById('saveall').onclick=saveAll;
    document.getElementById('discard').onclick=function(){ dirty={}; renderEdit(document.getElementById('view')); refreshBar(); };
    show('inbox');
    loadInbox();
  }
  function show(v){
    VIEW=v;
    [].forEach.call(document.querySelectorAll('.tabnav button'),function(b){ b.classList.toggle('on', b.getAttribute('data-v')===v); });
    var host=document.getElementById('view'), sb=document.getElementById('savebar');
    try{ window.scrollTo(0,0); }catch(e){}
    if(v==='edit'){ sb.style.display=''; renderEdit(host); refreshBar(); }
    else { sb.style.display='none'; sb.classList.remove('on'); if(v==='inbox'){ renderInbox(host); loadInbox(); } else renderTeam(host); }
  }

  // ---------- inbox ----------
  var IBDATA={items:[],counts:{pending:0,approved:0,declined:0}}, IBST='pending', IBCAT='all', ibBusy=false, ibLoaded=false;
  var STLABEL={pending:'New',approved:'Handled',declined:'Archived'};
  function ago(iso){ try{ var s=(Date.now()-new Date(iso).getTime())/1000; if(s<60)return'just now'; if(s<3600)return Math.floor(s/60)+'m ago'; if(s<86400)return Math.floor(s/3600)+'h ago'; if(s<604800)return Math.floor(s/86400)+'d ago'; return new Date(iso).toLocaleDateString(); }catch(e){ return ''; } }
  function contactLink(c){ c=(c||'').trim(); if(!c) return ''; if(c.indexOf('@')>0) return '<a href="mailto:'+esc(c)+'">'+esc(c)+'</a>'; if(/^[+(]?[\d][\d\s()+-]{5,}$/.test(c)) return '<a href="tel:'+esc(c.replace(/[^\d+]/g,''))+'">'+esc(c)+'</a>'; return esc(c); }
  function setBadge(){ var b=document.getElementById('ibBadge'); if(!b) return; var n=IBDATA.counts.pending||0; b.textContent=n; b.hidden=!n; }
  function loadInbox(){
    ibapi({action:'admin_list',token:token}).then(function(r){
      if(r.ok&&r.j&&r.j.ok){ IBDATA={items:r.j.items||[],counts:r.j.counts||{pending:0,approved:0,declined:0}}; ibLoaded=true; setBadge(); if(VIEW==='inbox') renderInbox(document.getElementById('view')); }
      else if(r.status===401){ setTok(''); boot(); }
      else if(VIEW==='inbox'){ var h=document.getElementById('view'); if(h && !ibLoaded) h.innerHTML='<div class="ibempty">Couldn’t load the inbox — try again.</div>'; }
    }).catch(function(){ if(VIEW==='inbox'){ var h=document.getElementById('view'); if(h && !ibLoaded) h.innerHTML='<div class="ibempty">Couldn’t reach the inbox.</div>'; } });
  }
  function renderInbox(host){
    if(!host) return;
    var head='<div class="ibhead"><h2>Inbox</h2><p class="lead">Every inquiry and suggestion from the site — filter by reason, mark them handled as you go.</p></div>';
    if(!ibLoaded){ host.innerHTML=head+'<div class="ibempty">Loading…</div>'; return; }
    var st=IBST;
    var inSt=(IBDATA.items||[]).filter(function(it){ return it.status===st; });
    var cats={}; inSt.forEach(function(it){ var k=it.kind||'Other'; cats[k]=(cats[k]||0)+1; });
    var catKeys=Object.keys(cats).sort();
    if(IBCAT!=='all' && !cats[IBCAT]) IBCAT='all';
    var shown=inSt.filter(function(it){ return IBCAT==='all' || (it.kind||'Other')===IBCAT; });
    var h=head;
    h+='<div class="stseg">';
    ['pending','approved','declined'].forEach(function(s){ h+='<button data-st="'+s+'" class="'+(s===st?'on':'')+'">'+STLABEL[s]+' <i>'+(IBDATA.counts[s]||0)+'</i></button>'; });
    h+='</div>';
    h+='<div class="chips"><button data-cat="all" class="'+(IBCAT==='all'?'on':'')+'">All <i>'+inSt.length+'</i></button>';
    catKeys.forEach(function(k){ h+='<button data-cat="'+esc(k)+'" class="'+(IBCAT===k?'on':'')+'">'+esc(k)+' <i>'+cats[k]+'</i></button>'; });
    h+='</div>';
    if(!shown.length){ h+='<div class="ibempty">Nothing '+STLABEL[st].toLowerCase()+' here'+(IBCAT!=='all'?' in “'+esc(IBCAT)+'”':'')+'.</div>'; }
    else { h+='<div class="msgs">'+shown.map(msgCard).join('')+'</div>'; }
    host.innerHTML=h;
    host.querySelector('.stseg').addEventListener('click',function(e){ var b=e.target.closest('button[data-st]'); if(!b) return; IBST=b.getAttribute('data-st'); IBCAT='all'; renderInbox(host); });
    host.querySelector('.chips').addEventListener('click',function(e){ var b=e.target.closest('button[data-cat]'); if(!b) return; IBCAT=b.getAttribute('data-cat'); renderInbox(host); });
    var mg=host.querySelector('.msgs'); if(mg) mg.addEventListener('click',function(e){ var b=e.target.closest('button[data-act]'); if(!b) return; var card=e.target.closest('.msg'); if(!card) return; var id=card.getAttribute('data-id'), a=b.getAttribute('data-act'); if(a==='del') ibdel(id); else ibset(id,a); });
  }
  function msgCard(it){
    var who=[]; if((it.name||'').trim()) who.push('<b>'+esc(it.name.trim())+'</b>'); var cl=contactLink(it.contact); if(cl) who.push(cl);
    var acts='';
    if(it.status==='pending'){ acts='<button data-act="approved" class="ap">Mark handled</button><button data-act="declined">Archive</button>'; }
    else if(it.status==='approved'){ acts='<button data-act="pending">↩ New</button><button data-act="declined">Archive</button>'; }
    else { acts='<button data-act="pending">↩ New</button>'; }
    acts+='<button data-act="del" class="del" aria-label="Delete">✕</button>';
    return '<div class="msg" data-id="'+esc(it.id)+'">'
      +'<div class="mtop"><span class="cat">'+esc(it.kind||'Other')+'</span><span class="ago">'+esc(ago(it.created_at))+'</span></div>'
      +(who.length?'<div class="who">'+who.join(' · ')+'</div>':'')
      +'<div class="mbody">'+esc(it.body||'')+'</div>'
      +'<div class="mact">'+acts+'</div></div>';
  }
  function ibset(id,status){ if(ibBusy) return; ibBusy=true;
    ibapi({action:'admin_set',token:token,id:id,status:status}).then(function(r){ ibBusy=false;
      if(r.ok&&r.j&&r.j.ok){ IBDATA={items:r.j.items||[],counts:r.j.counts||IBDATA.counts}; setBadge(); renderInbox(document.getElementById('view')); toast('Moved to '+(STLABEL[status]||status)); }
      else if(r.status===401){ setTok(''); boot(); } else toast('Could not update.',true);
    }).catch(function(){ ibBusy=false; toast('Could not reach the inbox.',true); });
  }
  function ibdel(id){ if(ibBusy) return; if(!confirm('Delete this for good?')) return; ibBusy=true;
    ibapi({action:'admin_del',token:token,id:id}).then(function(r){ ibBusy=false;
      if(r.ok&&r.j&&r.j.ok){ IBDATA={items:r.j.items||[],counts:r.j.counts||IBDATA.counts}; setBadge(); renderInbox(document.getElementById('view')); toast('Deleted'); }
      else if(r.status===401){ setTok(''); boot(); } else toast('Could not delete.',true);
    }).catch(function(){ ibBusy=false; toast('Could not reach the inbox.',true); });
  }

  // ---------- edit site ----------
  function groups(){ var g=[], seen={}; MAN.forEach(function(m){ if(!(m.section in seen)){ seen[m.section]=g.length; g.push({name:m.section, items:[]}); } g[seen[m.section]].items.push(m); }); return g; }
  function renderEdit(host){
    var h='<p class="lead">Change any wording, or replace any photo — hit <b>Save</b> and it’s live. Signed in as '+esc(ME)+'.</p>';
    groups().forEach(function(g){
      h+='<div class="sec"><h3>'+esc(g.name)+'</h3>';
      g.items.forEach(function(m){
        if(m.type==='image'){
          h+='<div class="row img" data-k="'+esc(m.key)+'"><div class="th"><img id="th-'+esc(m.key)+'" src="'+esc(cur(m.key)||m.default||'')+'" alt="" loading="lazy"></div>'
            +'<div class="ic"><div class="lbl">'+esc(m.label)+'</div>'
            +'<label class="up">Replace photo<input type="file" accept="image/*" data-img="'+esc(m.key)+'" hidden></label>'
            +'<div class="hint">JPG/PNG, straight off your phone is fine.</div></div></div>';
        } else {
          var v=cur(m.key), big=(m.type==='long'||(v&&v.length>60));
          h+='<div class="row"><div class="lbl">'+esc(m.label)+'</div>'
            +(big?'<textarea data-t="'+esc(m.key)+'">'+esc(v)+'</textarea>':'<input data-t="'+esc(m.key)+'" value="'+esc(v)+'">')+'</div>';
        }
      });
      h+='</div>';
    });
    host.innerHTML=h;
    [].forEach.call(host.querySelectorAll('[data-t]'),function(el){ el.addEventListener('input',function(){ var k=el.getAttribute('data-t'); if(el.value===cur(k)){ delete dirty[k]; } else { dirty[k]=el.value; } refreshBar(); });
      if(el.tagName==='TEXTAREA'){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,360)+'px'; el.addEventListener('input',function(){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,360)+'px'; }); } });
    [].forEach.call(host.querySelectorAll('[data-img]'),function(inp){ inp.addEventListener('change',function(){ var f=inp.files&&inp.files[0]; if(f) uploadImg(inp.getAttribute('data-img'),f); inp.value=''; }); });
  }
  function refreshBar(){ var n=Object.keys(dirty).length; var bar=document.getElementById('savebar'); if(!bar) return; bar.classList.toggle('on',VIEW==='edit'&&n>0); var b=document.getElementById('saveall'); if(b) b.textContent = n? ('Save changes ('+n+')') : 'Save changes'; }
  function saveAll(){
    var items={}; Object.keys(dirty).forEach(function(k){ items[k]=dirty[k]; });
    if(!Object.keys(items).length){ toast('Nothing to save yet.'); return; }
    var b=document.getElementById('saveall'); b.disabled=true; b.textContent='Saving…';
    api({action:'save',token:token,items:items}).then(function(r){ b.disabled=false;
      if(r.ok&&r.j&&r.j.ok){ overrides=r.j.items||overrides; Object.keys(items).forEach(function(k){ overrides[k]=items[k]; }); dirty={}; refreshBar(); toast('Saved — it’s live.'); }
      else if(r.status===401){ toast('Signed out — log in again.',true); setTok(''); boot(); }
      else { toast((r.j&&r.j.error)||'Save failed.',true); refreshBar(); }
    }).catch(function(){ b.disabled=false; toast('Save failed — check connection.',true); refreshBar(); });
  }
  function uploadImg(key,file){
    toast('Uploading photo…');
    downscale(file,1600,0.86).then(function(dataUrl){ return api({action:'img',token:token,key:key,contentType:'image/jpeg',data:dataUrl}); }).then(function(r){
      if(r.ok&&r.j&&r.j.ok&&r.j.url){ overrides[key]=r.j.url; var th=document.getElementById('th-'+key); if(th) th.src=r.j.url+'?t='+Date.now(); toast('Photo updated — it’s live.'); }
      else if(r.status===401){ toast('Signed out — log in again.',true); setTok(''); boot(); }
      else toast((r.j&&r.j.error)||'Upload failed.',true);
    }).catch(function(){ toast('Upload failed — try a smaller photo.',true); });
  }
  function downscale(file,max,q){ return new Promise(function(resolve,reject){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){ try{ var w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h)); var c=document.createElement('canvas'); c.width=Math.round(w*s); c.height=Math.round(h*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg',q)); }catch(e){ reject(e); } };
    img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error('img')); }; img.src=url;
  }); }

  // ---------- team (who can edit) ----------
  function renderTeam(host){
    host.innerHTML='<div class="ibhead"><h2>Team</h2><p class="lead">Everyone here can open this desk — read the inbox and edit the site. Invite by email; they set their own password the first time they open the link.</p></div>'
      +'<div id="edList" class="edlist"><div class="hint">Loading…</div></div>'
      +'<div class="edadd"><input id="edEmail" type="email" inputmode="email" autocomplete="off" placeholder="teammate@email.com"><button class="up" id="edAdd">Invite</button></div>'
      +'<p class="err" id="edErr" style="min-height:0;margin-top:8px"></p>';
    wireEditors();
  }
  function edRow(e){
    return '<div class="edrow"><span class="em">'+esc(e.email)+'</span>'
      + (e.me?'<span class="mechip">you</span>':'')
      + '<span class="st '+(e.active?'a':'i')+'">'+(e.active?'Active':'Invited')+'</span>'
      + (e.me?'':'<button class="rm" data-rm="'+esc(e.email)+'" title="Remove">✕</button>')
      + '</div>';
  }
  function paintEditors(list){
    var el=document.getElementById('edList'); if(!el) return;
    el.innerHTML = (list&&list.length)? list.map(edRow).join('') : '<div class="hint">No editors yet.</div>';
    [].forEach.call(el.querySelectorAll('[data-rm]'),function(btn){ btn.onclick=function(){
      var em=btn.getAttribute('data-rm');
      if(!confirm('Remove '+em+'? They won’t be able to open the desk anymore.')) return;
      api({action:'editor_del',token:token,email:em}).then(function(r){
        if(r.ok&&r.j&&r.j.ok){ paintEditors(r.j.editors); toast('Removed '+em); }
        else if(r.status===401){ toast('Signed out — log in again.',true); setTok(''); boot(); }
        else toast((r.j&&r.j.error)||'Could not remove.',true);
      }).catch(function(){ toast('Could not reach the desk.',true); });
    }; });
  }
  function wireEditors(){
    var addBtn=document.getElementById('edAdd'), emIn=document.getElementById('edEmail'), errEl=document.getElementById('edErr');
    if(!addBtn) return;
    function add(){
      var e=(emIn.value||'').trim().toLowerCase(); errEl.textContent='';
      if(!e){ errEl.textContent='Enter an email.'; return; }
      addBtn.disabled=true;
      api({action:'editor_add',token:token,email:e}).then(function(r){
        addBtn.disabled=false;
        if(r.ok&&r.j&&r.j.ok){ emIn.value=''; paintEditors(r.j.editors); toast('Invited '+e+' — send them the desk link.'); }
        else if(r.status===401){ toast('Signed out — log in again.',true); setTok(''); boot(); }
        else errEl.textContent=(r.j&&r.j.error)||'Could not invite.';
      }).catch(function(){ addBtn.disabled=false; errEl.textContent='Could not reach the desk.'; });
    }
    addBtn.onclick=add; emIn.addEventListener('keydown',function(ev){ if(ev.key==='Enter') add(); });
    api({action:'editors_list',token:token}).then(function(r){ if(r.ok&&r.j&&r.j.ok) paintEditors(r.j.editors); else { var el=document.getElementById('edList'); if(el) el.innerHTML='<div class="hint">Couldn’t load editors.</div>'; } }).catch(function(){});
  }

  boot();
})();
</script>
</body></html>
