<script>
  document.documentElement.classList.add('js');
  (function(){
    var c=document.getElementById('court'); if(!c)return; var x=c.getContext('2d');
    function draw(){
      var w=c.clientWidth||innerWidth, h=c.clientHeight||innerHeight, dpr=Math.min(window.devicePixelRatio||1,2);
      c.width=w*dpr; c.height=h*dpr; x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h);
      x.strokeStyle='rgba(242,239,230,0.09)'; x.lineWidth=Math.max(1,Math.min(w,h)*0.0018);
      var cx=w/2, baseY=h*1.04, R=Math.min(w*0.44,h*0.66);
      x.beginPath(); x.arc(cx,baseY,R,Math.PI,2*Math.PI); x.stroke();
      var kW=R*0.42, kH=R*0.64; x.strokeRect(cx-kW/2, baseY-kH, kW, kH);
      x.beginPath(); x.arc(cx, baseY-kH, kW*0.58, 0, 2*Math.PI); x.stroke();
      var bb=kW*0.92; x.beginPath(); x.moveTo(cx-bb/2, baseY-R*0.055); x.lineTo(cx+bb/2, baseY-R*0.055); x.stroke();
      x.beginPath(); x.arc(cx, baseY-R*0.10, R*0.045, 0, 2*Math.PI); x.stroke();
      x.beginPath(); x.arc(cx, baseY-R, R*0.30, 0, Math.PI); x.stroke();
    }
    draw(); var t; addEventListener('resize',function(){clearTimeout(t);t=setTimeout(draw,120)});
  })();
  (function(){ /* glass bar after the hero */
    var tb=document.getElementById('topbar'); if(!tb)return; var last=null;
    function f(){ var s=scrollY>460; if(s!==last){ tb.classList.toggle('show',s); last=s; } }
    addEventListener('scroll',f,{passive:true}); f();
  })();
  (function(){ /* reveals: above-the-fold content is never hidden; below it rises in as you arrive */
    var els=[].slice.call(document.querySelectorAll('.rv'));
    var rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(rm||!('IntersectionObserver' in window)){ els.forEach(function(e){e.classList.add('in')}); return; }
    var vh=innerHeight; els.forEach(function(e){ if(e.getBoundingClientRect().top<vh*0.92) e.classList.add('in'); });
    var io=new IntersectionObserver(function(en){ en.forEach(function(x){ if(x.isIntersecting){ x.target.classList.add('in'); io.unobserve(x.target);} }); },{rootMargin:'0px 0px -6% 0px',threshold:.06});
    els.forEach(function(e){ if(!e.classList.contains('in')) io.observe(e); });
  })();
  (function(){ /* gentle parallax: crest + ghost text */
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var c=document.getElementById('crest'), g=document.querySelector('.program .ghost'), t=null;
    function f(){ var y=scrollY; if(c) c.style.transform='translateY('+Math.min(y,1400)*0.14+'px)';
      if(g){ var r=g.getBoundingClientRect(); if(r.top<innerHeight&&r.bottom>0) g.style.transform='translateX('+((r.top-innerHeight)*-0.06)+'px)'; } t=null; }
    addEventListener('scroll',function(){ if(!t) t=requestAnimationFrame(f); },{passive:true}); f();
  })();
</script>
<script>
  (function(){ /* contact & bookings: quick-select + in-place submit (Netlify Forms) */
    var f=document.getElementById('contactForm'), box=document.getElementById('cform'); if(!f) return;
    var live=f.getAttribute('data-live')!=='0', sel=document.getElementById('c-about');
    function pick(v,btn){ if(sel&&v) sel.value=v; document.querySelectorAll('#quick button').forEach(function(x){ x.classList.toggle('on', x===btn || (btn&&btn.tagName!=='BUTTON'&&x.getAttribute('data-about')===v)); }); }
    document.querySelectorAll('[data-about]').forEach(function(b){ b.addEventListener('click',function(){ pick(b.getAttribute('data-about'),b); if(b.tagName==='BUTTON'){ var n=document.getElementById('c-name'); if(n) n.focus({preventScroll:false}); } }); });
    f.addEventListener('submit',function(e){
      e.preventDefault(); if(!f.checkValidity()){ f.reportValidity(); return; }
      var btn=document.getElementById('cSend'); btn.disabled=true; btn.textContent='Sending…'; box.classList.remove('err');
      if(!live){ setTimeout(function(){ box.classList.add('sent'); },500); return; }
      fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(f)).toString()})
        .then(function(r){ if(!r.ok) throw new Error(r.status); box.classList.add('sent'); })
        .catch(function(){ box.classList.add('err'); btn.disabled=false; btn.textContent='Send it'; });
    });
  })();
</script>
<script>
  (function(){ /* welcome moment — once per device; ?welcome=1 forces it */
    var w=document.getElementById('welcome'); if(!w) return;
    var force=/[?&#]welcome=1/.test(location.search+location.hash), seen=false;
    try{ seen=localStorage.getItem('lotg_welcomed')==='1'; }catch(e){}
    if(/[?&#]sbox=1/.test(location.search+location.hash)) return;
    if(seen && !force) return;
    function open(){ w.hidden=false; document.documentElement.classList.add('lock'); requestAnimationFrame(function(){ requestAnimationFrame(function(){ w.classList.add('on'); }); }); }
    function close(){ w.classList.remove('on'); document.documentElement.classList.remove('lock'); try{ localStorage.setItem('lotg_welcomed','1'); }catch(e){} setTimeout(function(){ w.hidden=true; },450); }
    setTimeout(open, 1100);
    document.getElementById('wIn').addEventListener('click',close);
    document.getElementById('wLater').addEventListener('click',close);
    w.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
  })();
  (function(){ /* the suggestion box — letterbox + sheet; ?sbox=1 opens it */
    var lb=document.getElementById('lbox'), sb=document.getElementById('sbox'), sc=document.getElementById('sScrim'), f=document.getElementById('sugForm'); if(!lb||!sb||!f) return;
    var live=f.getAttribute('data-live')!=='0';
    function open(){ lb.classList.add('open'); sb.hidden=false; sc.hidden=false; requestAnimationFrame(function(){ requestAnimationFrame(function(){ sb.classList.add('on'); sc.classList.add('on'); }); }); lb.setAttribute('aria-expanded','true');
      setTimeout(function(){ var t=document.getElementById('s-text'); if(t) t.focus({preventScroll:true}); },380); }
    function close(){ sb.classList.remove('on'); sc.classList.remove('on'); lb.classList.remove('open'); lb.setAttribute('aria-expanded','false'); setTimeout(function(){ sb.hidden=true; sc.hidden=true; },380); }
    lb.addEventListener('click',function(){ sb.hidden?open():close(); });
    sc.addEventListener('click',close);
    document.getElementById('sClose').addEventListener('click',close);
    document.querySelectorAll('[data-sbox]').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); open(); }); });
    sb.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
    f.addEventListener('submit',function(e){
      e.preventDefault(); if(!f.checkValidity()){ f.reportValidity(); return; }
      var btn=document.getElementById('sSend'); btn.disabled=true; btn.textContent='Posting…'; sb.classList.remove('err');
      function done(){ sb.classList.add('sent'); lb.classList.add('thunk'); setTimeout(function(){ lb.classList.remove('thunk'); },900); }
      if(!live){ setTimeout(done,600); return; }
      fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(f)).toString()})
        .then(function(r){ if(!r.ok) throw new Error(r.status); done(); })
        .catch(function(){ sb.classList.add('err'); btn.disabled=false; btn.textContent='Post it'; });
    });
    document.getElementById('sAgain').addEventListener('click',function(){ f.reset(); sb.classList.remove('sent'); var b=document.getElementById('sSend'); b.disabled=false; b.textContent='Post it'; var t=document.getElementById('s-text'); if(t) t.focus(); });
    if(/[?&#]sbox=1/.test(location.search+location.hash)) setTimeout(open,600);
  })();
</script>
