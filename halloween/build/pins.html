<title>Hollow Press — Pinterest pins</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* 1000 x 1500 — Pinterest's 2:3. Everything sized in px off that canvas. */
  html,body{margin:0; padding:0; background:#000; overflow:hidden}
  @media screen{ body{background:#000; padding:0} }

  .pin{position:relative; width:1000px; height:1500px; overflow:hidden;
       display:flex; flex-direction:column; align-items:center}

  /* ---- light pin: bone paper, ink type. Stands out in a dark feed. ---- */
  .lt{background:#F1E9DA; color:var(--ink)}
  .lt .eyebrow{color:#7C6F63}
  .lt .foot{background:var(--ink); color:#F1E9DA}

  /* ---- dark pin: the gaslit ground ---- */
  .dk{background:radial-gradient(120% 80% at 50% 16%, #4A2740 0%, #24121F 48%, #0E080C 100%);
      color:#F0E4CA}
  .dk.ox{background:radial-gradient(120% 80% at 50% 16%, #7A2029 0%, #3A1216 48%, #0E0708 100%)}
  .dk .eyebrow{color:rgba(232,214,178,.66)}
  .dk .foot{background:rgba(0,0,0,.42); color:#F0E4CA;
      border-top:1px solid rgba(232,214,178,.3)}

  .eyebrow{font-family:"HPCaps",serif; font-size:26px; letter-spacing:.4em;
       text-transform:uppercase; margin-top:64px}
  h1{font-family:"HPSlab",serif; font-size:104px; line-height:.94; margin:26px 60px 0;
     text-align:center; text-wrap:balance}
  h1.show{font-family:"HPShow",serif; font-size:92px; line-height:1.02}
  h1.eng{font-family:"HPEngrave",serif; font-weight:700; font-size:80px;
     letter-spacing:.03em; line-height:1.08}
  .kicker{font-family:"HPText",serif; font-style:italic; font-size:38px;
     margin-top:22px; text-align:center; padding:0 90px; opacity:.85}

  /* the product, shown as a sheet on the table */
  .stack{flex:1; width:100%; display:flex; align-items:center;
     justify-content:center; position:relative; margin-top:14px}
  .sheet{background:#fff; box-shadow:0 26px 60px rgba(0,0,0,.42);
     border:1px solid rgba(0,0,0,.1); overflow:hidden}
  .sheet img{display:block; width:100%; height:100%; object-fit:cover;
     object-position:top center}
  .s1{width:430px; height:608px; transform:rotate(-4deg)}
  .s2{width:430px; height:608px; transform:rotate(3.5deg); margin-left:-110px}
  .one{width:520px; height:735px; transform:rotate(-1.5deg)}
  .wide{width:660px; height:466px}
  .phones{display:flex; gap:26px; align-items:center}
  .phone{width:246px; height:533px; border-radius:34px; overflow:hidden;
     box-shadow:0 22px 52px rgba(0,0,0,.5); border:3px solid rgba(255,255,255,.12)}
  .phone img{display:block; width:100%; height:100%; object-fit:cover}
  .phone.mid{width:276px; height:598px}

  .foot{width:100%; padding:30px 60px 34px; display:flex;
     align-items:center; justify-content:space-between; gap:20px}
  .foot .brand{font-family:"HPCaps",serif; font-size:29px; letter-spacing:.3em;
     text-transform:uppercase}
  .foot .price{font-family:"HPEngrave",serif; font-weight:700; font-size:34px;
     letter-spacing:.1em; text-transform:uppercase; text-align:right; line-height:1.2}
  .foot .price small{display:block; font-family:"HPType",monospace;
     font-size:17px; letter-spacing:.14em; opacity:.72; margin-top:5px}

  .ribbon{position:absolute; top:0; right:0; padding:16px 34px;
     font-family:"HPType",monospace; font-size:20px; letter-spacing:.16em;
     text-transform:uppercase; background:var(--oxblood); color:#fff}
  .dk .ribbon{background:#E8C27A; color:#1A1418}
</style>

<div id="stage"></div>

<script>
const PV = "../previews/";
const WP = "../products/gaslight-wallpapers/";

const PINS = [
  /* ---- The Sideshow Set ---- */
  { t:"lt", eyebrow:"Vintage Halloween", h:"8 SIDESHOW<br>POSTERS",
    face:"", kick:"Victorian carnival broadsides. Print at home, frame tonight.",
    price:"$12", note:"instant download", ribbon:"A4 + US Letter",
    art:`<div class="sheet s1"><img src="${PV}the-sideshow-set.png"></div>
         <div class="sheet s2"><img src="${PV}haunted-carnival-party-pack.png"></div>` },
  { t:"dk", eyebrow:"For One Night Only", h:"He Casts<br>No Shadow",
    face:"show", kick:"A set of eight sideshow bills for your Halloween walls.",
    price:"$12", note:"8 printable posters", ribbon:"new",
    art:`<div class="sheet one"><img src="${PV}the-sideshow-set.png"></div>` },

  /* ---- Poison labels ---- */
  { t:"lt", eyebrow:"Apothecary", h:"30 POISON<br>JAR LABELS",
    face:"", kick:"Real botanicals, real Latin, properly ominous dosing notes.",
    price:"$7", note:"print &amp; cut", ribbon:"30 labels",
    art:`<div class="sheet one"><img src="${PV}poison-apothecary-labels.png"></div>` },
  { t:"dk", eyebrow:"Handle With Gloves", h:"BELLADONNA<br>HEMLOCK<br>WOLFSBANE",
    face:"eng", kick:"Turn any jar into something from the poison cabinet.",
    price:"$7", note:"instant download", ribbon:"labels",
    art:`<div class="sheet one"><img src="${PV}poison-apothecary-labels.png"></div>` },

  /* ---- Party pack ---- */
  { t:"dk", eyebrow:"Throw The Whole Thing", h:"HAUNTED<br>CARNIVAL<br>PARTY KIT",
    face:"", kick:"Invitations, banner, photo-booth signs, table tents, drinks menu.",
    price:"$14", note:"8 printable sheets", ribbon:"best value",
    art:`<div class="sheet s1"><img src="${PV}haunted-carnival-party-pack.png"></div>
         <div class="sheet s2"><img src="${PV}the-mourning-table.png"></div>` },
  { t:"lt", eyebrow:"Print Tonight, Host Tomorrow", h:"A PARTY IN<br>ONE FILE",
    face:"", kick:"Everything the room needs, in one download. No posting, no waiting.",
    price:"$14", note:"party pack", ribbon:"A4 + US Letter",
    art:`<div class="sheet one"><img src="${PV}haunted-carnival-party-pack.png"></div>` },

  /* ---- Tickets ---- */
  { t:"lt", eyebrow:"Admit One", h:"40 TICKETS,<br>TAGS &amp;<br>TOKENS",
    face:"", kick:"Tear-off stubs, gift tags and ride tokens for the whole night.",
    price:"$5", note:"instant download", ribbon:"40 pieces",
    art:`<div class="sheet one"><img src="${PV}admit-one-tickets-and-tags.png"></div>` },

  /* ---- Mourning table ---- */
  { t:"dk", eyebrow:"Six Courses, One Empty Chair", h:"THE<br>MOURNING<br>TABLE",
    face:"eng", kick:"Place cards, menu, table numbers and a seating plan.",
    price:"$9", note:"dinner party set", ribbon:"new",
    art:`<div class="sheet one"><img src="${PV}the-mourning-table.png"></div>` },

  /* ---- Wallpapers ---- */
  { t:"dk", eyebrow:"Free With Any Order", h:"12 PHONE<br>WALLPAPERS",
    face:"", kick:"Gaslit, quiet, and clear of your clock. iPhone and Android.",
    price:"$4", note:"24 files, 2 sizes", ribbon:"wallpapers",
    art:`<div class="phones">
           <div class="phone"><img src="${WP}03_do-not-tap-the-glass_iphone_1290x2796.jpg"></div>
           <div class="phone mid"><img src="${WP}01_it-never-stops-turning_iphone_1290x2796.jpg"></div>
           <div class="phone"><img src="${WP}10_all-hallows-eve_iphone_1290x2796.jpg"></div>
         </div>` },

  /* ---- Shop-level pins: these do the heavy lifting on a new account ---- */
  { t:"lt", eyebrow:"Hollow Press", h:"THE WHOLE<br>VAULT",
    face:"", kick:"Every sheet in the shop, plus everything we print next. One price.",
    price:"$29", note:"save $22", ribbon:"bundle",
    art:`<div class="sheet s1"><img src="${PV}the-sideshow-set.png"></div>
         <div class="sheet s2"><img src="${PV}poison-apothecary-labels.png"></div>` },
  { t:"dk", eyebrow:"Halloween Is A Saturday This Year", h:"BOTH<br>WEEKENDS",
    face:"eng", kick:"Print it the same night. Nothing to post, nothing to wait for.",
    price:"From $4", note:"instant download", ribbon:"shop",
    art:`<div class="sheet s1"><img src="${PV}haunted-carnival-party-pack.png"></div>
         <div class="sheet s2"><img src="${PV}the-sideshow-set.png"></div>` },
  { t:"dk", eyebrow:"No Orange, No Plastic", h:"A QUIETER<br>HALLOWEEN",
    face:"", kick:"Burgundy, plum and antique gold. Letterpress, not clip art.",
    price:"From $4", note:"printables", ribbon:"vintage",
    art:`<div class="sheet one"><img src="${PV}the-mourning-table.png"></div>` },
];

function render(i) {
  const p = PINS[i];
  const dark = p.t === "dk";
  document.getElementById("stage").innerHTML = `
    <div class="pin ${p.t} ${i % 3 === 1 && dark ? "ox" : ""}">
      <div class="ribbon">${p.ribbon}</div>
      <div class="eyebrow">${p.eyebrow}</div>
      <h1 class="${p.face}">${p.h}</h1>
      <div class="kicker">${p.kick}</div>
      <div class="stack">${p.art}</div>
      <div class="foot">
        <span class="brand">Hollow Press</span>
        <span class="price">${p.price}<small>${p.note}</small></span>
      </div>
    </div>`;
}

const q = new URLSearchParams(location.search);
if (q.has("i")) render(+q.get("i"));
window.PINS = PINS;
document.documentElement.dataset.ready = "1";
</script>
